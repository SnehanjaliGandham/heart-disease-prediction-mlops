# Prometheus configuration for Docker Compose (docker-compose.yml).
# Same job name and alert rules as on Kubernetes, but a fixed target: the `api` service.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: docker-compose

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: heart-disease-api
    static_configs:
      - targets: ["api:8000"]
        labels:
          pod: heart-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
