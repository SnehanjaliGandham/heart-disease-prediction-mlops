# Voluntary disruptions (node drain, cluster upgrade) must leave at least one pod serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: heart-disease-api
  namespace: heart-disease
  labels:
    app.kubernetes.io/name: heart-disease-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heart-disease-api
